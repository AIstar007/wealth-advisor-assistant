[project]
name = "wealth-advisor-agent"
version = "1.1.0"
description = "Production-oriented multi-agent Wealth Advisor Assistant using Microsoft Agent Framework and Azure AI Foundry."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "agent-framework-core==1.21.0",
  "agent-framework-openai==1.16.0",
  "agent-framework-foundry==1.14.1",
  "agent-framework-ag-ui[a2ui]==1.4.0",
  "azure-identity>=1.25,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
  "integration: requires live Azure credentials",
]

[tool.ruff]
line-length = 100
exclude = [".venv", "logs", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
